name: CI + Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # Reads the exact version from packageManager in package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Worker typecheck
        run: pnpm typecheck:worker

      - name: Tests
        run: pnpm test

      # Deploy only happens if every step above passed.
      # VITE_* vars are baked into the bundle at build time. Google client id is
      # public OAuth configuration; the session itself is created by the Worker.
      - name: Build
        run: pnpm build
        env:
          VITE_SYNC_URL: ${{ secrets.VITE_SYNC_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      # VITE_* must be present HERE TOO so the uploaded production bundle keeps
      # the same runtime configuration as the CI build.
      - name: Deploy to Netlify (production, fixed site)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          pnpm --package=netlify-cli@latest dlx netlify deploy \
            --dir=dist \
            --prod \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN"
        env:
          VITE_SYNC_URL: ${{ secrets.VITE_SYNC_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
