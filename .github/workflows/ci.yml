name: CI + Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Reads the exact version from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      # Deploy only happens if every step above passed.
      # VITE_* vars are baked into the bundle at build time (SPEC §9.8) —
      # without them production ships with no sync backend and no VAPID key.
      - name: Build
        run: pnpm build
        env:
          VITE_SYNC_URL: ${{ secrets.VITE_SYNC_URL }}
          VITE_SYNC_SECRET: ${{ secrets.VITE_SYNC_SECRET }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      # VITE_* must be present HERE TOO: netlify-cli runs a framework-
      # detected internal rebuild of the project before uploading, using
      # panel-only env otherwise — that silently discarded our CI-built
      # bundle with all four vars missing except whatever lived in the
      # Netlify panel.
      - name: Deploy to Netlify (production, fixed site)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          pnpm --package=netlify-cli@latest dlx netlify deploy \
            --dir=dist \
            --prod \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN"
        env:
          VITE_SYNC_URL: ${{ secrets.VITE_SYNC_URL }}
          VITE_SYNC_SECRET: ${{ secrets.VITE_SYNC_SECRET }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
